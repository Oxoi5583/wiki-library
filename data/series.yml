  orders:
    - id: publication
      title: 出版／閱讀順序
      items:
        - work: inherit-the-stars
          label: 第一部
        - work: gentle-giants-of-ganymede
          label: 第二部
        - work: giants-star
          label: 第三部
        - work: entoverse
          label: 第四部
        - work: mission-to-minerva
          label: 第五部

gunbuster:
  title: 飛越巔峰系列
  original_title: トップをねらえ！
  aliases: [Gunbuster Series, Aim for the Top!, Diebuster]
  description: GAINAX 以宇宙怪獸、相對論時間差與巨大機器人為核心的科幻 OVA 系列；1988 年《飛越巔峰》與 2004 年《飛越巔峰2》相隔多年製作，但構成直接續作關係。
  sources:
    - label: Bandai Namco Filmworks《トップをねらえ！＆トップをねらえ2！》
      url: https://www.bandainamco.co.jp/cgi-bin/releases/index.cgi/press/11332?entry_id=7970
  orders:
    - id: release
      title: 發行／觀看順序
      items:
        - work: gunbuster
          label: 第一部
        - work: diebuster
          label: 第二部

project-itoh:
  title: 伊藤計劃三部作
  original_title: Project Itoh
  aliases: [伊藤計劃系列, Project Itoh Trilogy]
  description: 以伊藤計劃代表性長篇為核心的作品群，包括《虐殺器官》《和諧》以及由伊藤遺稿、設定與圓城塔續筆完成的《屍者的帝國》。三部作品並非同一世界觀的連續故事，因此只表示關聯作品群，不表示劇情順序。
  sources:
    - label: 伊藤計劃作品資料
      url: https://zh.wikipedia.org/wiki/%E4%BC%8A%E8%97%A4%E8%A8%88%E5%8A%83
    - label: 獨步文化《屍者的帝國》
      url: https://www.cite.com.tw/book?id=42853
  orders:
    - id: core
      title: 核心長篇
      ordered: false
      notes: 這三部沒有共同的故事時間線；此清單只表示華文出版與 Project Itoh 動畫企劃中常被並列的核心作品。
      items:
        - work: genocidal-organ
        - work: harmony
        - work: empire-of-corpses

