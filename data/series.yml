    - label: 天下文化《3001：太空漫遊》
      url: https://bookzone.cwgv.com.tw/book/BSF001
  orders:
    - id: publication
      title: 出版／閱讀順序
      items:
        - work: 2001-a-space-odyssey
          label: 第一部
        - work: 2010-odyssey-two
          label: 第二部
        - work: 2061-odyssey-three
          label: 第三部
        - work: 3001-the-final-odyssey
          label: 第四部

giants:
  title: 巨人系列
  original_title: Giants
  aliases: [Giants Series, Giants Novels, Giant's Series]
  description: 詹姆士・霍根以月球上的五萬年前人類遺骸為起點，逐步追索人類、甘尼米人、Minerva 與遠古太陽系歷史的硬科幻系列；最初三部形成一個完整段落，後來擴展為五部。
