# 系列成員與不同順序在這裡集中維護，不另算成一件館藏。
# 格式見 templates/series.yml 與 README.md。

toujou-genya:
  title: 刀城言耶系列
  original_title: 刀城言耶シリーズ
  aliases: []
  description: 三津田信三以怪奇幻想作家刀城言耶為核心的民俗本格／恐怖推理系列。這裡先記錄目前已收入館藏的代表作，不把未收錄作品之間的空缺誤作直接前後作。
  sources:
    - label: 講談社《首無の如き祟るもの》作品頁
      url: https://www.kodansha.co.jp/book/products/0000205356
  orders:
    - id: library-members
      title: 目前館藏成員
      ordered: false
      notes: 僅表示目前 Wiki Library 已收錄的刀城言耶系列作品，不是完整出版順序。
      items:
        - work: majimono-no-gotoki-tsukumono
        - work: kubinashi-no-gotoki-tatarumono
        - work: yamanma-no-gotoki-waraumono
        - work: mizuchi-no-gotoki-shizumumono

sakka-sanbusaku:
  title: 作家三部作
  original_title: 作家三部作
  aliases: [三津田信三系列]
  description: 以「三津田信三」本人作為敘事者之一、讓現實與虛構互相滲透的後設小說系列。名義上為三編，其中第三編拆成《蛇棺葬》與《百蛇堂》前後兩冊，因此館藏共有四件作品。
  sources:
    - label: 講談社《作者不詳　ミステリ作家の読む本（上）》
      url: https://www.kodansha.co.jp/book/products/0000205332
    - label: 講談社《百蛇堂〈怪談作家の語る話〉》
      url: https://www.kodansha.co.jp/book/products/0000206245
  orders:
    - id: release
      title: 出版順序
      notes: 《蛇棺葬》與《百蛇堂》合為第三編的前後篇；閱讀《百蛇堂》前應先讀《蛇棺葬》。
      items:
        - work: ikan-horror-sakka-no-sumu-ie
          label: 第一編
        - work: sakusha-fusho
          label: 第二編
        - work: jakansou
          label: 第三編・前編
        - work: hyakujado
          label: 第三編・後編

shell-bullet:
  title: Schell Bullet
  original_title: シェルブリット
  aliases: [SHELL BULLET]
  description: 幾原邦彥與永野護共同創作的科幻視覺小說系列，以進化為巨大宇宙船的「Gene Liner」人類種為核心。
  sources:
    - label: KADOKAWA《シェルブリット I ADEN ARABIE》
      url: https://www.kadokawa.co.jp/product/199999853091/
    - label: KADOKAWA《シェルブリット II ABRAXAS》
      url: https://www.kadokawa.co.jp/product/199999853129/
  orders:
    - id: release
      title: 出版順序
      items:
        - work: shell-bullet-1-aden-arabie
          label: I
        - work: shell-bullet-2-abraxas
          label: II

seikai:
  title: 星界系列
  original_title: 星界シリーズ
  aliases: [Seikai Series]
  description: 森岡浩之以「亞維人類帝國」與其人工語言、星際政治、軍事制度為核心建構的太空歌劇系列；主線由《星界的紋章》與《星界的戰旗》構成，《星界的斷章》則收錄不同年代與人物的短篇。
  sources:
    - label: 早川書房《星界の紋章Ⅰ》
      url: https://www.hayakawa-online.co.jp/shop/g/g0000020547/
    - label: 早川書房《星界の断章Ⅰ》
      url: https://www.hayakawa-online.co.jp/shop/g/g0000020802/
  orders:
    - id: main-story
      title: 主線出版／閱讀順序
      notes: 先讀《星界的紋章》三冊，再進入《星界的戰旗》。目前館藏先收錄至繁中尖端版已出版的《戰旗 IV》；後續日文卷保留位置。
      items:
        - work: seikai-monsho-1
          label: 紋章 I
        - work: seikai-monsho-2
          label: 紋章 II
        - work: seikai-monsho-3
          label: 紋章 III
        - work: seikai-senki-1
          label: 戰旗 I
        - work: seikai-senki-2
          label: 戰旗 II
        - work: seikai-senki-3
          label: 戰旗 III
        - work: seikai-senki-4
          label: 戰旗 IV
        - title: 星界の戦旗Ⅴ ―宿命の調べ―
          original_title: 星界の戦旗Ⅴ ―宿命の調べ―
          label: 戰旗 V・尚未收錄
        - title: 星界の戦旗Ⅵ ―帝国の雷鳴―
          original_title: 星界の戦旗Ⅵ ―帝国の雷鳴―
          label: 戰旗 VI・尚未收錄
    - id: fragments
      title: 斷章短篇集
      ordered: true
      notes: 《星界的斷章》補寫亞維歷史、角色過去與主線未細述的事件，可在熟悉主線後穿插閱讀。
      items:
        - work: seikai-dansho-1
          label: 斷章 I
        - title: 星界の断章Ⅱ
          original_title: 星界の断章Ⅱ
          label: 斷章 II・尚未收錄
        - title: 星界の断章Ⅲ
          original_title: 星界の断章Ⅲ
          label: 斷章 III・尚未收錄

barsoom:
  title: 巴森系列
  original_title: Barsoom
  aliases: [Barsoom Series, 火星系列]
  description: 埃德加・賴斯・巴勒斯以火星「Barsoom」為舞台的行星羅曼史／科學奇幻系列，《火星公主》為第一部。
  sources:
    - label: Project Gutenberg《A Princess of Mars》
      url: https://www.gutenberg.org/ebooks/62
  orders:
    - id: publication
      title: 主要出版順序
      notes: 目前館藏只正式收錄第一部，後續先保留位置。
      items:
        - work: a-princess-of-mars
          label: 第一部
        - title: 火星眾神
          original_title: The Gods of Mars
          label: 第二部・尚未收錄
        - title: 火星戰神
          original_title: The Warlord of Mars
          label: 第三部・尚未收錄

hitchhikers-guide:
  title: 銀河便車指南系列
  original_title: The Hitchhiker's Guide to the Galaxy
  aliases: [Hitchhiker's Guide to the Galaxy series, 便車系列]
  description: Douglas Adams 的科幻喜劇小說系列，源自他為 BBC 寫的同名廣播喜劇。Adams 本人寫了五部，自稱「分成五部的三部曲」；第六部由 Eoin Colfer 執筆。
  sources:
    - label: Pan Macmillan：The Hitchhiker's Guide to the Galaxy books — a complete guide
      url: https://www.panmacmillan.com/blogs/science-fiction-and-fantasy/hitchhikers-guide-to-the-galaxy-book-series
    - label: 豆瓣叢書「銀河便車指南」（木馬文化）
      url: https://book.douban.com/series/33395
  orders:
    - id: publication
      title: 出版順序
      notes: 目前館藏只收錄第一部，後續先保留位置。中文書名依木馬文化 2016 年版。
      items:
        - work: hitchhikers-guide-to-the-galaxy
          label: 第一部
        - title: 銀河便車指南 2：宇宙盡頭的餐廳
          original_title: The Restaurant at the End of the Universe
          label: 第二部
          notes: 1980 年出版。
        - title: 銀河便車指南 3：生命，宇宙及萬事萬物
          original_title: Life, the Universe and Everything
          label: 第三部
          notes: 1982 年出版。
        - title: 銀河便車指南 4：掰掰，謝謝你們的魚啦
          original_title: So Long, and Thanks for All the Fish
          label: 第四部
          notes: 1984 年出版。
        - title: 銀河便車指南 5：大部無害
          original_title: Mostly Harmless
          label: 第五部
          notes: 1992 年出版。
        - title: 銀河便車指南 6：啊，還有一件事……
          original_title: And Another Thing...
          label: 第六部
          notes: Eoin Colfer 著，2009 年出版。
