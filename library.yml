title: Wiki Library
subtitle: 跨媒體作品圖書館
description: 跨媒體作品目錄，提供中原文名稱、作品分類、主創、簡介、特色及版本資料。

# 媒體：作品是以甚麼形式呈現。新增鍵值即可擴充。
media:
  novel: 小說
  academic: 學術書
  film: 電影
  animation: 動畫
  game: 遊戲
  comic: 漫畫
  nonfiction: 非虛構
  series: 影集
  music: 音樂
  other: 其他

# 作品分類：使用通行的文類、作品類型或學術領域。
# 跨媒體的學科與題材（哲學、軍事、政治學等）記在各作品的 tags。
